spring:
  application:
    name: satire-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/satire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  modulith:
    detection-strategy: explicitly-annotated

server:
  error:
    include-message: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}
  mail:
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from: ${MAIL_FROM:satire.noreply@gmail.com}
    confirmation-expiration: ${EMAIL_CONFIRMATION_EXPIRATION:86400}
    outbox:
      max-attempts: ${MAIL_OUTBOX_MAX_ATTEMPTS:5}
      stale-after: ${MAIL_OUTBOX_STALE_AFTER:PT15M}
      poll-interval: ${MAIL_OUTBOX_POLL_INTERVAL:PT1M}
      retry-base: ${MAIL_OUTBOX_RETRY_BASE:PT30S}
      bulkhead: ${MAIL_OUTBOX_BULKHEAD:4}
      rate-limit-per-minute: ${MAIL_OUTBOX_RATE_LIMIT_PER_MINUTE:30}
