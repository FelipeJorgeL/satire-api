spring:
  application:
    name: satire-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/satire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  modulith:
    detection-strategy: explicitly-annotated
  web:
    error:
      include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
