spring:
  application:
    name: satire-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/satire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  modulith:
    detection-strategy: explicitly-annotated
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    require-secure-transport: ${REQUIRE_SECURE_TRANSPORT:false}
  inventory:
    reservation-expiration: ${STOCK_RESERVATION_EXPIRATION:PT30M}
    reservation-expiration-interval: ${STOCK_RESERVATION_EXPIRATION_INTERVAL:PT1M}
  payment:
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET:}
      tolerance: ${PAYMENT_WEBHOOK_TOLERANCE:PT5M}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}
  mail:
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from: ${MAIL_FROM:noreply@example.com}
    confirmation-expiration: ${EMAIL_CONFIRMATION_EXPIRATION:86400}
    outbox:
      max-attempts: ${MAIL_OUTBOX_MAX_ATTEMPTS:5}
      stale-after: ${MAIL_OUTBOX_STALE_AFTER:PT15M}
      poll-interval: ${MAIL_OUTBOX_POLL_INTERVAL:PT1M}
      retry-base: ${MAIL_OUTBOX_RETRY_BASE:PT30S}
      bulkhead: ${MAIL_OUTBOX_BULKHEAD:4}
      rate-limit-per-minute: ${MAIL_OUTBOX_RATE_LIMIT_PER_MINUTE:30}
