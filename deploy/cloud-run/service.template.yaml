apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: satire-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: REPLACE_WITH_RUNTIME_SERVICE_ACCOUNT
      containers:
        - image: REPLACE_WITH_REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/satire-api:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_BASE_URL
              value: https://REPLACE_WITH_PUBLIC_BASE_URL
            - name: REQUIRE_SECURE_TRANSPORT
              value: "true"
            - name: DB_USERNAME
              value: REPLACE_WITH_NEON_USERNAME
            - name: MAIL_FROM
              value: REPLACE_WITH_VERIFIED_SENDER
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: satire-db-url
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: satire-db-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: satire-jwt-secret
                  key: latest
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: satire-sendgrid-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
