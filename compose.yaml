name: satire-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-satire}
      POSTGRES_USER: ${POSTGRES_USER:-satire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satire_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
    environment:
      DB_URL: ${DB_URL:?DB_URL must be set in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      REQUIRE_SECURE_TRANSPORT: ${REQUIRE_SECURE_TRANSPORT:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
